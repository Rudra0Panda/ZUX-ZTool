name: Android CI

on:
  schedule:
    - cron: '0 16 * * *'         # UTC 16:00 = 00:00 next day UTC+8
  workflow_dispatch:              # Manual trigger (always builds)
  pull_request:
    branches: [ "master" ]        # PR triggers Debug build

# Set a user-friendly title for the workflow run
run-name: ${{ github.event_name == 'schedule' && 'Nightly' || github.event_name == 'workflow_dispatch' && 'Manual' || 'PR' }} build #${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Full history needed for commit info

      # ---- Fetch current commit info ----
      - name: Get current commit info
        id: commit-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "subject=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      # ---- For schedule and workflow_dispatch events, restore previous build SHA ----
      - name: Restore previous build commit SHA
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .last-build-sha
          key: nightly-commit-sha-master-${{ github.run_id }}
          restore-keys: nightly-commit-sha-master-

      # ---- Fetch all commits since previous build ----
      - name: Get commit range for summary
        id: commit-range
        run: |
          if [[ -f .last-build-sha ]]; then
            last_sha=$(cat .last-build-sha)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log ${last_sha}..HEAD --pretty=format:"- **\`%h\`** %s (%an)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "commits=- **\`$(git rev-parse --short HEAD)\`** $(git log -1 --pretty=%s) ($(git log -1 --pretty=%an))" >> $GITHUB_OUTPUT
          fi

      # ---- Determine whether to build ----
      - name: Determine if build is needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Event ${{ github.event_name }} → building."
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ -f .last-build-sha ]]; then
              last_sha=$(cat .last-build-sha)
              current_sha="${{ steps.commit-info.outputs.sha }}"
              if [[ "$last_sha" == "$current_sha" ]]; then
                echo "should_build=false" >> $GITHUB_OUTPUT
                echo "No new commits since last nightly, skipping build."
              else
                echo "should_build=true" >> $GITHUB_OUTPUT
                echo "New commits detected, building."
              fi
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "No previous build SHA found, building."
            fi
          else
            # Other events (unexpected) build by default
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      # ---- Set up JDK and prepare gradlew only if build is needed ----
      - name: Set up JDK 17
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      # ---- Build only when needed ----
      # Debug build (PR always builds; others depend on should_build)
      - name: Build debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-debug-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

      # ---- Release build (schedule or workflow_dispatch when build needed) ----
      - name: Prepare release keystore
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        env:
          ZTOOL_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZTOOL_RELEASE_KEYSTORE_BASE64 }}
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ZTOOL_RELEASE_KEYSTORE_BASE64"
          test -n "$ZTOOL_RELEASE_STORE_PASSWORD"
          test -n "$ZTOOL_RELEASE_KEY_ALIAS"
          test -n "$ZTOOL_RELEASE_KEY_PASSWORD"
          printf '%s' "$ZTOOL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ztool-release.jks"
          chmod 600 "$RUNNER_TEMP/ztool-release.jks"

      - name: Build signed release APK
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        env:
          ZTOOL_RELEASE_STORE_FILE: ${{ runner.temp }}/ztool-release.jks
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-release-signed-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error

      # ---- Save current commit SHA for future nightly runs (only upon success) ----
      - name: Save current commit SHA for future nightly
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.commit-info.outputs.sha }}" > .last-build-sha

      - name: Save cache
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v5
        with:
          path: .last-build-sha
          key: nightly-commit-sha-master-${{ github.run_id }}

      # ---- Generate Job Summary displaying commit info ----
      - name: Generate job summary
        if: always()
        env:
          # Multi-line values must pass through env: inline ${{ }} in run strips newlines
          COMMITS: ${{ steps.commit-range.outputs.commits }}
        run: |
          echo "## Build Details" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo '**Commit SHA:** `${{ steps.commit-info.outputs.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo "### Commits" >> $GITHUB_STEP_SUMMARY
          echo "$COMMITS" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check.outputs.should_build }}" == "true" ]]; then
            echo "**Status:** ✅ Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⏭️ Skipped (no new commits)" >> $GITHUB_STEP_SUMMARY
          fi